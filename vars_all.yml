#
# vars_all.yml
#
# Файл с переменными Ansible для всех сред
# Файл предназначен для задания DevOps: https://sbt-jenkins.delta.sbrf.ru/datafactory/job/DataFactory/job/DataMart/job/UploadAnsibleVars_all_stands/
# Описание задания:https://confluence.ca.sbrf.ru/display/DOTOOLS/UploadAnsibleVars_all_stands
#
# GIT_PROJECT: DFFESS
# GIT_REPO: vspc_idl
# GIT_BRANCH: release/4.0
# DEVOPS_CONFIG: devops.json
#
# ---------------------------------------------------------------------------
# AQE-флаги издателя — общее пояснение для всех стендов
#
# PublisherDao.java:406-409 (vendor/rt-fw-publisher-2.16.1-src; в сборку
# подключается rt-fw-publisher:2.16.1 — см. mvn dependency:tree) открывает
# ветку SPARK_REBALANCE только при spark.sql.adaptive.enabled=true И
# spark.sql.adaptive.optimizeSkewsInRebalancePartitions.enabled=true.
# Иначе издатель уходит в SALTING, и это видно лишь по косвенному признаку:
# в логе вместо "алгоритм SALTING" (PublisherDao.java:220-222) печатается
# PUB_054 "используется Spark hint 'rebalance'" (PublisherDao.java:316).
# Режим SPARK_REBALANCE выставляет код: PublisherMode.sparkRebalance
# (src/main/java/ru/sberbank/bigdata/dffess/vspc/common/PublisherMode.java),
# подключаемый во всех 9 трансформациях.
# В Spark 3.5.1 оба флага по умолчанию true (SQLConf: ADAPTIVE_EXECUTION_ENABLED
# и ADAPTIVE_OPTIMIZE_SKEWS_IN_REBALANCE_PARTITIONS_ENABLED созданы с
# createWithDefault(true)), поэтому явная запись нужна не для смены поведения
# Spark, а чтобы значение не переопределил spark-defaults.conf окружения
# стенда: --conf в командной строке spark-submit приоритетнее файла.
# ---------------------------------------------------------------------------
#
# Порядок --conf единый для всех профилей; наборы ключей и значения описаны
# в отчёте temp/synthetic_20261103/reports/P06_run_conf_polish_report.md.
#

vars: &commonVars
  logical_env_prefix: ""
  base_path: "/oozie-app/t/idl/vspc_idl"

  file_path: "{{ base_path }}/rtfw/"
  YARN_QUEUE: "vspc"
  debug_logical_env: ""

  data_sets: ""

  parallel_threads: 10
  debug_sk_off: ""
  build_version: "D-02.104.001"
  devops_distributive_jar: "vspc_idl-{{ build_version }}-jar-with-dependencies.jar"

  logical_env_prefix_with_slash: ""
  logical_env_ctl_entity_logenv_number: "00"
  yarn_queue_init: "{{ YARN_QUEUE }}"

  resourceGroup: "{{ YARN_QUEUE }}"
  yarn_queue: "{{ YARN_QUEUE }}"
  kerberos_realm: "{{ REALM }}"
  domain: "{{ REALM }}"

  data_owner_name: "SN"
  org_lvl2_name: "СП.Дивизион \\\"Моделирование и исследование данных\\\""
  secman_cert_owner_email: "dvilapshin@sberbank.ru"
  cert_enabled_flag: "true"
  recover_flag: "false"

  archiveStat_FakeCardCode: "2"
  archiveProfile_FakeCardCode: "Default"

  resetted_entities: ""

  starting_business_date: ""

  kafka_topic: "log-CI02619185-CI02619185"

  CTL_PROFILE_NAME_gar_fias_idl: "{{ CTL_PROFILE_NAME }}"
  CTL_PROFILE_NAME_rdm_idl_spark: "{{ CTL_PROFILE_NAME }}"
  rtfw_log_level: "INFO"
  # Глубина окна инкремента (число дней). Значение — как в release/3.0 (vars_all.yml:57 = 10).
  # В release/3.0 этот CTL-параметр доходил до приложения, но НЕ читался: CtlAdapterImpl.java:59 ->
  # AppConfiguration.java:85 -> TransformConfiguration.java:95 (только поле; вызовов
  # getMaxIncrementDepthDays() в essa-common-lib нет) — параметр там инертен. Фактическое окно
  # обновления 3.0 задаёт код: VspcConstant.DEPTH_DELTA = 40 (VspcConstant.java:12) ->
  # getIncrCutOffSrcDate() = current_date()-40 (VspcTransformConfiguration.java:48,59,64).
  # В release/4.0 (RT-FW 3.16.1) параметр читается (PublisherImpl.java:284-287) и задаёт
  # startingBusinessDate = max(CTL starting_business_date, today - MIDD) (PublisherImpl.java:573-582),
  # НО после FX2.5 и FX9.1 на состав строк целевых таблиц (8 snp + 8 diff) НЕ влияет:
  #  - FX2.5 снял фильтр дельты по MIDD (HistoricalPeriodWithRewriteChangesCalculator, incrMinDt = inc);
  #  - FX9.1 считает порог месячной зоны перезаписи от D-1 независимо от MIDD (override getSnpGeqFilters);
  #  - чтение снапа не отсекается по бизнес-дате (override getMinBusinessDateUpdateFilter = lit(true)).
  # Значение MIDD меняет только диагностическое сообщение PUB-117 (не содержимое целевых таблиц).
  max_increment_depth_days: 10

stands:
  # DEV
  - stand_inventory: sdpdevfess
    vars:
      <<: *commonVars
      cluster_name: "sklsdpfess"
      # AQE-флаги издателя: обязательны для режима SPARK_REBALANCE
      # (ворота PublisherDao.java:406-409). Полное пояснение — в шапке файла.
      spark_parameters_default: "--conf spark.sql.legacy.parquet.int96RebaseModeInRead=CORRECTED --conf spark.sql.legacy.parquet.int96RebaseModeInWrite=CORRECTED --conf spark.sql.legacy.parquet.datetimeRebaseModeInRead=CORRECTED --conf spark.sql.legacy.parquet.datetimeRebaseModeInWrite=CORRECTED --conf spark.hadoop.metastore.catalog.default=spark --conf spark.shuffle.service.enabled=true --conf spark.sql.parquet.writeLegacyFormat=true --conf spark.sql.adaptive.enabled=true --conf spark.sql.adaptive.optimizeSkewsInRebalancePartitions.enabled=true --conf spark.executor.memory=2G --conf spark.driver.memory=5G --conf spark.dynamicAllocation.enabled=true --conf spark.dynamicAllocation.minExecutors=5 --conf spark.dynamicAllocation.maxExecutors=40 --conf 'spark.executor.extraJavaOptions=-Djava.security.auth.login.config=/etc/zookeeper/conf/zookeeper_client_jaas.conf -Dsun.security.jgss.native=true -Djavax.security.auth.useSubjectCredsOnly=false' --conf 'spark.driver.extraJavaOptions=-Djava.security.auth.login.config=/etc/zookeeper/conf/zookeeper_client_jaas.conf -Dsun.security.jgss.native=true -Djavax.security.auth.useSubjectCredsOnly=false'"
      spark_parameters: "{{ spark_parameters_default }}"
      # Потоки INIT и INCR получают ОДИН И ТОТ ЖЕ набор параметров: CTL-шаблон в обоих потоках
      # читает spark_parameters (ctl_wait4replica_usl_vspc_idl_v021_fw_3.16.1.yaml:136-137 и
      # :292-293) ⇒ отдельного набора для INIT нет и не предполагается.
      hadoop_default_fs_uri: "hdfs://FESS-DEV"
      user_name: "u_sklsdpfess_s_usl_t_vspc_idl"
      USER_NAME: "u_sklsdpfess_s_usl_t_vspc_idl"
      uslCluster: "sdpdevfess"
      system_area_type: "q_SDP_comm"
      archiveProfile_sfs: "Default"
      kafka_broker_list: "tvlsq-log000001.dev.df.sbrf.ru:9093,tvlsq-log000002.dev.df.sbrf.ru:9093,tvlsq-log000003.dev.df.sbrf.ru:9093,tvlsq-log000004.dev.df.sbrf.ru:9093,tvlsq-log000005.dev.df.sbrf.ru:9093,tvlsq-log000006.dev.df.sbrf.ru:9093"

