vars: &commonVars
  logical_env_prefix: ""
  base_path: "/oozie-app/t/idl/vspc_idl"

  file_path: "{{ base_path }}/init/"
  YARN_QUEUE: "vspc"
  debug_logical_env: ""

  data_sets: ""

  parallel_threads: 10
  debug_distributive_path: "{{ base_path }}/lib"
  debug_sk_off: "false"
  build_version: "D-01.703.002"
  devops_distributive_jar: "vspc_idl-{{ build_version }}-jar-with-dependencies.jar"

  logical_env_prefix_with_slash: ""
  logical_env_ctl_entity_logenv_number: "00"
  yarn_queue_init: "{{ YARN_QUEUE }}"

  resourceGroup: "{{ YARN_QUEUE }}"
  yarn_queue: "{{ YARN_QUEUE }}"
  kerberos_realm: "{{ REALM }}"
  domain: "{{ REALM }}"

  data_owner_name: "SN"
  org_lvl2_name: "СП.Дивизион \\\"Моделирование и исследование данных\\\""
  secman_cert_owner_email: "dvilapshin@sberbank.ru"
  hdfs_path: "/oozie-app/t/tools/trivDistCp"
  jar_name_triv: "triv_ess-distcp.jar"
  cert_enabled_flag: "false"
  recover_flag: "false"

  archiveStat_FakeCardCode: "2"
  archiveProfile_FakeCardCode: "Default"
  short_product_code: "vspc_idl"

  calc_logs_depth_days: ""
  sk_greenfield: ""
  resetted_entities: ""

  starting_business_date: "2019-06-01"

  kafka_topic: "log-CI02619185-CI02619185"

stands:
  # DEV
  - stand_inventory: sdpdevfess
    vars:
      <<: *commonVars
      cluster_name: "sklsdpfess"
      spark_parameters_default: "--conf spark.sql.legacy.parquet.int96RebaseModeInRead=CORRECTED --conf spark.sql.legacy.parquet.int96RebaseModeInWrite=CORRECTED --conf spark.sql.legacy.parquet.datetimeRebaseModeInRead=CORRECTED --conf spark.sql.legacy.parquet.datetimeRebaseModeInWrite=CORRECTED --conf spark.shuffle.service.enabled=true --conf spark.hadoop.metastore.catalog.default=spark --conf spark.sql.parquet.writeLegacyFormat=true --conf spark.executor.memory=2G --conf spark.dynamicAllocation.enabled=true --conf spark.dynamicAllocation.minExecutors=5 --conf spark.dynamicAllocation.maxExecutors=40 --conf spark.driver.memory=5G"
      spark_submit_kvno: "--conf spark.driver.extraJavaOptions='-Dsun.security.jgss.native=true -Djavax.security.auth.useSubjectCredsOnly=false'"
      appConf: "essa_debug_sk_off=ON_GF"
      spark_parameters: "{{ spark_parameters_default }}"
      spark_parameters_init: "{{ spark_parameters_default }}"
      hadoop_default_fs_uri: "hdfs://FESS-DEV"
      user_name: "u_sklsdpfess_s_usl_t_vspc_idl"
      USER_NAME: "u_sklsdpfess_s_usl_t_vspc_idl"
      uslCluster: "sdpdevfess"
      system_area_type: "q_SDP_comm"
      log_level: "ESSA"
      sl_secman_sberca_role: "client_3y_AS_rsa"
      archiveProfile_sfs: "Default"
      kafka_broker_list: "tvlsq-log000001.dev.df.sbrf.ru:9093,tvlsq-log000002.dev.df.sbrf.ru:9093,tvlsq-log000003.dev.df.sbrf.ru:9093,tvlsq-log000004.dev.df.sbrf.ru:9093,tvlsq-log000005.dev.df.sbrf.ru:9093,tvlsq-log000006.dev.df.sbrf.ru:9093"
#      kafka_topic: "log-kafka-04"

  # IFT
