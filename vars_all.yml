# 
# vars_all.yml
#
# Файл с переменными Ansible для всех сред
# Файл предназначен для задания DevOps: https://sbt-jenkins.delta.sbrf.ru/datafactory/job/DataFactory/job/DataMart/job/UploadAnsibleVars_all_stands/
# Описание задания:https://confluence.ca.sbrf.ru/display/DOTOOLS/UploadAnsibleVars_all_stands
#
# GIT_PROJECT: DFFESS
# GIR_REPO: vspc_idl
# GIT_BRANCH: develop
# DEVOPS_CONFIG: ctl.json
#

vars: &commonVars
  logical_env_prefix: ""
  base_path: "/oozie-app/t/idl/vspc_idl"
  
  file_path: "{{ base_path }}/init/"
  YARN_QUEUE: "vspc"
  debug_logical_env: ""

  data_sets: "usl_vspc_idl.addr.hub;usl_vspc_idl.addr_h.sat=h;usl_vspc_idl.div_.hub;usl_vspc_idl.div_h.sat=h;usl_vspc_idl.div_type.sat=h;usl_vspc_idl.terr_div_type.hub"

  parallel_threads: 1
  debug_distributive_path: "{{ base_path }}/lib"
  debug_sk_off: "N"
  build_version: "D-01.302.015"
  devops_distributive_jar: "vspc_idl-{{ build_version }}-jar-with-dependencies.jar"

  logical_env_prefix_with_slash: ""
  logical_env_ctl_entity_logenv_number: "00"
  yarn_queue_init: "{{ YARN_QUEUE }}"

  resourceGroup: "{{ YARN_QUEUE }}"
  yarn_queue: "{{ YARN_QUEUE }}"
  kerberos_realm: "{{ REALM }}"
  domain: "{{ REALM }}"
  max_increment_depth: "10"

  data_owner_name: "SN"
  org_lvl2_name: "СП.Управление моделирования и исследования данных"
  secman_cert_owner_email: "dvilapshin@sberbank.ru"

stands:
  # DEV
  - stand_inventory: sdpdevfess
    vars:
      <<: *commonVars
      cluster_name: "sklsdpfess"
      spark_parameters: "--conf spark.sql.legacy.parquet.int96RebaseModeInRead=CORRECTED --conf spark.sql.legacy.parquet.int96RebaseModeInWrite=CORRECTED --conf spark.sql.legacy.parquet.datetimeRebaseModeInRead=CORRECTED --conf spark.sql.legacy.parquet.datetimeRebaseModeInWrite=CORRECTED --conf spark.shuffle.service.enabled=true --conf spark.hadoop.metastore.catalog.default=spark --conf spark.sql.parquet.writeLegacyFormat=true --conf spark.executor.memory=2G --conf spark.dynamicAllocation.enabled=true --conf spark.dynamicAllocation.minExecutors=5 --conf spark.dynamicAllocation.maxExecutors=40 --conf spark.driver.memory=5G"
      hdfs_path: "/oozie-app/triv_ess"
      hadoop_default_fs_uri: "hdfs://FESS-DEV"
      user_name: "u_sklsdpfess_s_usl_t_vspc_idl"
      USER_NAME: "u_sklsdpfess_s_usl_t_vspc_idl"
      uslCluster: "sdpdevfess"
      rtfw_feature_hub_daks: "N"
      system_area_type: "q_SDP_comm"
      log_level: "ESSA"

  # IFT
  - stand_inventory: sdpiftfess
    vars:
      <<: *commonVars
      cluster_name: "itsklsdpfess"
      spark_parameters: "--conf spark.sql.legacy.parquet.int96RebaseModeInRead=CORRECTED --conf spark.sql.legacy.parquet.int96RebaseModeInWrite=CORRECTED --conf spark.sql.legacy.parquet.datetimeRebaseModeInRead=CORRECTED --conf spark.sql.legacy.parquet.datetimeRebaseModeInWrite=CORRECTED --conf spark.shuffle.service.enabled=true --conf spark.hadoop.metastore.catalog.default=spark --conf spark.sql.parquet.writeLegacyFormat=true --conf spark.executor.memory=5G --conf spark.dynamicAllocation.enabled=true --conf spark.dynamicAllocation.minExecutors=5 --conf spark.dynamicAllocation.maxExecutors=40 --conf spark.driver.memory=5G"
      hdfs_path: "/oozie-app/app/TRiV/trifrunner"
      hadoop_default_fs_uri: "hdfs://FESS-IFT"
      user_name: "u_itsklsdpfess_s_usl_t_vspc_idl"
      USER_NAME: "u_itsklsdpfess_s_usl_t_vspc_idl"
      yarn_queue: "default"
      resourceGroup: "default"
      YARN_QUEUE: "default"
      uslCluster: "sdpiftfess"
      rtfw_feature_hub_daks: "Y"
      system_area_type: "q_SDP_ESS"
      log_level: "INFO"

  # RDT
  - stand_inventory: utarnsdpfess
    vars:
      <<: *commonVars
      cluster_name: "utarnsdpfess"
      spark_parameters: "--conf spark.sql.legacy.parquet.int96RebaseModeInRead=CORRECTED --conf spark.sql.legacy.parquet.int96RebaseModeInWrite=CORRECTED --conf spark.sql.legacy.parquet.datetimeRebaseModeInRead=CORRECTED --conf spark.sql.legacy.parquet.datetimeRebaseModeInWrite=CORRECTED --conf spark.executor.memory=10G --conf spark.executor.cores=2 --conf spark.sql.shuffle.partitions=600 --conf spark.driver.memory=20G --conf spark.hadoop.metastore.catalog.default=spark --conf spark.shuffle.service.enabled=true --conf spark.sql.parquet.writeLegacyFormat=true --conf spark.driver.maxResultSize=20G --conf spark.driver.memoryOverhead=10G --conf spark.executor.memoryOverhead=3G --conf spark.dynamicAllocation.enabled=true --conf spark.dynamicAllocation.minExecutors=10 --conf spark.dynamicAllocation.maxExecutors=100 --conf spark.memory.fraction=0.6 --conf spark.network.timeout=800 --conf spark.yarn.am.waitTime=1000000"
      hdfs_path: "/oozie-app/app/TRiV/trifrunner"
      hadoop_default_fs_uri: "hdfs://utarnsdpfess"
      user_name: "u_utarnsdpfess_s_usl_t_vspc_idl"
      USER_NAME: "u_utarnsdpfess_s_usl_t_vspc_idl"
      uslCluster: "utarnsdpfess"
      rtfw_feature_hub_daks: "N"
      system_area_type: "{{ YARN_QUEUE }}"
      log_level: "ESSA"
      yarn_queue_init: "init"

  # PROM NEW
  - stand_inventory: arnsdpfess2
    vars:
      <<: *commonVars
      cluster_name: "arn6sdpfess"
      spark_parameters: "--conf spark.sql.legacy.parquet.int96RebaseModeInRead=CORRECTED --conf spark.sql.legacy.parquet.int96RebaseModeInWrite=CORRECTED --conf spark.sql.legacy.parquet.datetimeRebaseModeInRead=CORRECTED --conf spark.sql.legacy.parquet.datetimeRebaseModeInWrite=CORRECTED --conf spark.executor.memory=10G --conf spark.executor.cores=2 --conf spark.sql.shuffle.partitions=600 --conf spark.driver.memory=10G --conf spark.hadoop.metastore.catalog.default=spark --conf spark.shuffle.service.enabled=true --conf spark.sql.parquet.writeLegacyFormat=true --conf spark.driver.maxResultSize=2G --conf spark.driver.memoryOverhead=5G --conf spark.executor.memoryOverhead=3G --conf spark.dynamicAllocation.enabled=true --conf spark.dynamicAllocation.minExecutors=10 --conf spark.dynamicAllocation.maxExecutors=100 --conf spark.yarn.access.hadoopFileSystems=hdfs://hdfsgw/,hdfs://arnsdpfess2/ --conf spark.memory.fraction=0.6 --conf spark.network.timeout=800 --conf spark.yarn.am.waitTime=1000000"
      hdfs_path: "/oozie-app/app/TRiV/trifrunner"
      hadoop_default_fs_uri: "hdfs://arnsdpfess2"
      user_name: "u_arn6sdpfess_s_usl_t_vspc_idl"
      USER_NAME: "u_arn6sdpfess_s_usl_t_vspc_idl"
      uslCluster: "arnsdpfess2"
      rtfw_feature_hub_daks: "Y"
      system_area_type: "ARNSDPFESS_queue_vspc"
      log_level: "INFO"
      yarn_queue_init: "init"
