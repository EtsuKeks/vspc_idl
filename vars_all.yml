      # поэтому maxExecutors=300 до стенда не доезжает; потребителя этой переменной в репозитории нет.
      hadoop_default_fs_uri: "hdfs://utarnsdpfess"
      user_name: "u_utarnsdpfess_s_usl_t_vspc_idl"
      USER_NAME: "u_utarnsdpfess_s_usl_t_vspc_idl"
      uslCluster: "utarnsdpfess"
      system_area_type: "utarnsdpfess_vspc"
      yarn_queue_init: "init"
      kafka_broker_list: "pvloq-log000209.log.df.sbrf.ru:9093,pvloq-log000210.log.df.sbrf.ru:9093,pvloq-log000211.log.df.sbrf.ru:9093,pvloq-log000212.log.df.sbrf.ru:9093,pvloq-log000213.log.df.sbrf.ru:9093,pvloq-log000214.log.df.sbrf.ru:9093,pvloq-log000215.log.df.sbrf.ru:9093,pvloq-log000216.log.df.sbrf.ru:9093,pvloq-log000217.log.df.sbrf.ru:9093,pvloq-log000218.log.df.sbrf.ru:9093,pvloq-log000219.log.df.sbrf.ru:9093,pvloq-log000220.log.df.sbrf.ru:9093,pvloq-log000221.log.df.sbrf.ru:9093,pvloq-log000222.log.df.sbrf.ru:9093,pvloq-log000223.log.df.sbrf.ru:9093"

  # PROM NEW
