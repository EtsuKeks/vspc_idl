      spark_parameters_default: "--conf spark.sql.legacy.parquet.int96RebaseModeInRead=CORRECTED --conf spark.sql.legacy.parquet.int96RebaseModeInWrite=CORRECTED --conf spark.sql.legacy.parquet.datetimeRebaseModeInRead=CORRECTED --conf spark.sql.legacy.parquet.datetimeRebaseModeInWrite=CORRECTED --conf spark.hadoop.metastore.catalog.default=spark --conf spark.shuffle.service.enabled=true --conf spark.sql.parquet.writeLegacyFormat=true --conf spark.sql.adaptive.enabled=true --conf spark.sql.adaptive.optimizeSkewsInRebalancePartitions.enabled=true --conf spark.executor.cores=2 --conf spark.executor.memory=10G --conf spark.executor.memoryOverhead=3G --conf spark.driver.memory=10G --conf spark.driver.memoryOverhead=5G --conf spark.driver.maxResultSize=20G --conf spark.sql.shuffle.partitions=600 --conf spark.memory.fraction=0.6 --conf spark.network.timeout=800 --conf spark.yarn.am.waitTime=1000000 --conf spark.dynamicAllocation.enabled=true --conf spark.dynamicAllocation.minExecutors=10 --conf spark.dynamicAllocation.maxExecutors=100 --conf 'spark.executor.extraJavaOptions=-Djava.security.auth.login.config=/etc/zookeeper/conf/zookeeper_client_jaas.conf -Dsun.security.jgss.native=true -Djavax.security.auth.useSubjectCredsOnly=false' --conf 'spark.driver.extraJavaOptions=-Djava.security.auth.login.config=/etc/zookeeper/conf/zookeeper_client_jaas.conf -Dsun.security.jgss.native=true -Djavax.security.auth.useSubjectCredsOnly=false'"
