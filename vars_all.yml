      spark_parameters_default: "--conf spark.sql.legacy.parquet.int96RebaseModeInRead=CORRECTED --conf spark.sql.legacy.parquet.int96RebaseModeInWrite=CORRECTED --conf spark.sql.legacy.parquet.datetimeRebaseModeInRead=CORRECTED --conf spark.sql.legacy.parquet.datetimeRebaseModeInWrite=CORRECTED --conf spark.hadoop.metastore.catalog.default=spark --conf spark.shuffle.service.enabled=true --conf spark.sql.parquet.writeLegacyFormat=true --conf spark.sql.adaptive.enabled=true --conf spark.sql.adaptive.optimizeSkewsInRebalancePartitions.enabled=true --conf spark.executor.memory=1G --conf spark.driver.memory=1G --conf spark.dynamicAllocation.enabled=true --conf spark.dynamicAllocation.minExecutors=2 --conf spark.dynamicAllocation.maxExecutors=10 --conf 'spark.executor.extraJavaOptions=-Djava.security.auth.login.config=/etc/zookeeper/conf/zookeeper_client_jaas.conf -Dsun.security.jgss.native=true -Djavax.security.auth.useSubjectCredsOnly=false' --conf 'spark.driver.extraJavaOptions=-Djava.security.auth.login.config=/etc/zookeeper/conf/zookeeper_client_jaas.conf -Dsun.security.jgss.native=true -Djavax.security.auth.useSubjectCredsOnly=false'"
      spark_parameters: "{{ spark_parameters_default }}"
      # Потоки INIT и INCR получают ОДИН И ТОТ ЖЕ набор параметров: CTL-шаблон в обоих потоках
      # читает spark_parameters (ctl_wait4replica_usl_vspc_idl_v021_fw_3.16.1.yaml:136-137 и
      # :292-293) ⇒ отдельного набора для INIT нет и не предполагается.
      hadoop_default_fs_uri: "hdfs://iftbalsdpfess"
      user_name: "u_itbalsdpfess_s_usl_t_vspc_idl"
      USER_NAME: "u_itbalsdpfess_s_usl_t_vspc_idl"
      yarn_queue: "default"
