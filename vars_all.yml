# 
# vars_all.yml
#
# Файл с переменными Ansible для всех сред
# Файл предназначен для задания DevOps: https://sbt-jenkins.delta.sbrf.ru/datafactory/job/DataFactory/job/DataMart/job/UploadAnsibleVars_all_stands/
# Описание задания:https://confluence.ca.sbrf.ru/display/DOTOOLS/UploadAnsibleVars_all_stands
#
# GIT_PROJECT: DFFESS
# GIR_REPO: vspc_idl
# GIT_BRANCH: develop
# DEVOPS_CONFIG: devops.json
#
# !!!! Все URL указывать без конечного знака - "/"
#
# 11/11/2021 - начальная версия
#

vars: &commonVars
  YARN_QUEUE: "default"
  supportTeam: "РО: Мануйлов Алексей/alvmanuylov@sberbank.ru"      # CTL -> support_team
  logical_env_prefix: ""
  logical_env: ""
  logical_env_prefix_with_slash: ""
  src_schema: "usl_{{ logical_env_prefix }}vspc_idl_in_snp"
  ooziePath: "/oozie-app/bsp/vspc/vspc_idl"
  userName: "{{ USER_NAME }}"
  keytabPath: "/keytab/{{ userName }}.keytab"
  principal_alias: "{{ userName }}@{{ REALM }}"
  logical_env_ctl_entity_logenv_number: "00"
  hadoop_default_fs_uri: ""
  sparkConf: "--conf spark.executor.memory=10G --conf spark.executor.cores=3 --conf spark.sql.shuffle.partitions=600 --conf spark.driver.memory=8G --conf spark.hadoop.metastore.catalog.default=spark --conf spark.shuffle.service.enabled=true --conf spark.sql.parquet.writeLegacyFormat=true --conf spark.driver.maxResultSize=4G --conf spark.driver.memoryOverhead=12G --conf spark.executor.memoryOverhead=12G --conf spark.dynamicAllocation.enabled=true --conf spark.dynamicAllocation.minExecutors=10 --conf spark.dynamicAllocation.maxExecutors=50 --conf spark.yarn.access.hadoopFileSystems=hdfs://hdfsgw/,hdfs://utarnsdpfess/ --conf spark.sql.legacy.allowCreatingManagedTableUsingNonemptyLocation=true --conf spark.memory.fraction=0.6 --conf spark.network.timeout=800"

stands:
  # DEV
  - stand_inventory: sdpdevfess
    vars:
      <<: *commonVars
      yarnQueue: "{{ YARN_QUEUE }}"
      yarnQueueInit: "{{ YARN_QUEUE }}"
      USER_NAME: "u_sklsdpfess_s_usl_t_vspc_idl"
      sk_host: "mimi16.dev.df.sbrf.ru"
      sk_logical_env: "da13"
      sk_name_serv: "FESS-DEV"
      sparkConf: "--conf spark.shuffle.service.enabled=true --conf spark.hadoop.metastore.catalog.default=spark --conf spark.sql.parquet.writeLegacyFormat=true --conf spark.executor.memory=5G --conf spark.dynamicAllocation.enabled=true --conf spark.dynamicAllocation.minExecutors=5 --conf spark.dynamicAllocation.maxExecutors=40 --conf spark.driver.memory=5G"
  # IFT
  - stand_inventory: sdpiftfess
    vars:
      <<: *commonVars
      yarnQueue: "{{ YARN_QUEUE }}"
      yarnQueueInit: "{{ YARN_QUEUE }}"
      USER_NAME: "u_itsklsdpfess_s_usl_t_vspc_idl"
      sk_host: "mimi16.dev.df.sbrf.ru"
      sk_logical_env: "da13"
      sk_name_serv: "FESS-DEV"

  # RDT
  - stand_inventory: utarnsdpfess
    vars:
      <<: *commonVars
      yarnQueue: "gl"
      yarnQueueInit: "init"
      USER_NAME: "u_utarnsdpfess_s_usl_t_vspc_idl"
      sk_host: "pplis-fauna1440.cloud.df.sbrf.ru"
      sk_logical_env: "null"
      sk_name_serv: "utarnsdpfess"

  # PROM
  - stand_inventory: arnsdpfess
    vars:
      <<: *commonVars
      yarnQueue: "gl"
      yarnQueueInit: "init"
      USER_NAME: "u_arnsdpfess_s_usl_t_vspc_idl"
      sk_host: "domrat10.cloud.df.sbrf.ru"
      sk_logical_env: "null"
      sk_name_serv: "arnsdpfess"
      sparkConf: "--conf spark.executor.memory=10G --conf spark.executor.cores=3 --conf spark.sql.shuffle.partitions=600 --conf spark.driver.memory=8G --conf spark.hadoop.metastore.catalog.default=spark --conf spark.shuffle.service.enabled=true --conf spark.sql.parquet.writeLegacyFormat=true --conf spark.driver.maxResultSize=4G --conf spark.driver.memoryOverhead=12G --conf spark.executor.memoryOverhead=12G --conf spark.dynamicAllocation.enabled=true --conf spark.dynamicAllocation.minExecutors=10 --conf spark.dynamicAllocation.maxExecutors=50 --conf spark.yarn.access.hadoopFileSystems=hdfs://hdfsgw/,hdfs://arnsdpfess/,hdfs://clsklod7:8020 --conf spark.sql.legacy.allowCreatingManagedTableUsingNonemptyLocation=true --conf spark.memory.fraction=0.6 --conf spark.network.timeout=800"

  # PROM NEW
  - stand_inventory: arnsdpfess2
    vars:
      <<: *commonVars
      yarnQueue: "gl"
      yarnQueueInit: "init"
      USER_NAME: "u_arn6sdpfess_s_usl_t_vspc_idl"
      sk_host: "domrat10.cloud.df.sbrf.ru"
      sk_logical_env: "null"
      sk_name_serv: "arnsdpfess2"
      sparkConf: "--conf spark.executor.memory=10G --conf spark.executor.cores=3 --conf spark.sql.shuffle.partitions=600 --conf spark.driver.memory=8G --conf spark.hadoop.metastore.catalog.default=spark --conf spark.shuffle.service.enabled=true --conf spark.sql.parquet.writeLegacyFormat=true --conf spark.driver.maxResultSize=4G --conf spark.driver.memoryOverhead=12G --conf spark.executor.memoryOverhead=12G --conf spark.dynamicAllocation.enabled=true --conf spark.dynamicAllocation.minExecutors=10 --conf spark.dynamicAllocation.maxExecutors=50 --conf spark.yarn.access.hadoopFileSystems=hdfs://hdfsgw/,hdfs://arnsdpfess2/ --conf spark.sql.legacy.allowCreatingManagedTableUsingNonemptyLocation=true --conf spark.memory.fraction=0.6 --conf spark.network.timeout=800"