#docs sigma https://confluence.sberbank.ru/pages/viewpage.action?pageId=5795646230
---
categories:
  - category:
      id: -1
      name: "VSPC"
      parent_id: "{{ CTL_PARENT_ID_K803 }}"
      action: "k803"
      deleted: false
workflows:
  - "{{ logical_env_prefix }}USL_VSPC_IDL_TRIV_BACKUP":
      name: "{{ logical_env_prefix }}USL_VSPC_IDL_TRIV_BACKUP"
      category: "{{ logical_env_prefix }}USL_TRIV"
      profile: "{{ CTL_PROFILE_NAME }}"
      singleLoading: true
      type: principal
      orchestrator: oozie
      killyarnjobonerror: false
      startCondition:
         $type: and
         inner:
           - $type: statVal
             # original entity id 801005314 - vspc_idl
             entityId : "801{{ logical_env_ctl_entity_logenv_number }}5314"
             profile: "{{ CTL_PROFILE_NAME }}"
             statId: 12
           - $type: timeOfDay
             fromMs: 46800000
             untilMs: 86340000
      params:
        - param:
        # Для backup это последний loading_id, а для restore  нужно задать руками
            name: backupLID
            prior_value: "blank"
        - param:
        # NameNode claster
            name: defaultFs
            prior_value: "{{ hadoop_default_fs_uri }}"
        - param:
        # параметр среды для логического окружения
            name: env
            prior_value: "blank"
        - param:
        #  имя утилиты
            name: jar_name
            prior_value: "{{ jar_name_triv }}"
        - param:
        # путь до утилиты
            name: jars_path
            prior_value: "{{ hdfs_path }}"
        - param:
        # Под кем авторизуемся, для Ndl  и IDL  разные
            name: keytab
            prior_value: "{{ user_name }}.keytab"
        - param:
        # Логи
            name: logs_path
            prior_value: "{{ hdfs_path }}/log"
        - param:
        # Метод запуска
            name: method
            prior_value: "backup"
        - param:
        # Путь для до workflow.xml
            name: oozie.wf.application.path
            prior_value: "{{ hdfs_path }}"
        - param:
        # авторизация в hdfs
            name: principal
            prior_value: "{{ user_name }}@{{ domain }}"
        - param:
        # Какой дата продукт backup
            name: productEntityId
            prior_value: "801{{ logical_env_ctl_entity_logenv_number }}5314"
        - param:
        # наименование продукта
            name: productName
            prior_value: "vspc_idl"
        - param:
        # Диретория в дата продукте которую backup
            name: sourceDirectory
            prior_value: "snp;stg"
        - param:
        # Очередь задания в oozie
            name: ss_queue
            prior_value: "{{ resourceGroup }}"
        - param:
        # имя пользователя под кем запускается backup
            name: user.name
            prior_value: "{{ user_name }}"
        - param:
        # путь до keytab
            name: user_keytab_path
            prior_value: "/keytab"
        - param:
        #  путь к location до hdfs
            name: sourcePath
            prior_value: "vspc_idl"
        - param:
        # период расписания  когда производится backup, задаются дни года когда производится  backup
            name: bkpPeriod
            prior_value: "m(1,7,14,21)"
        - param:
        # Количество хранимых backup
            name: bkpNumbers
            prior_value: 2
      notifications:
          - { status: "ERROR", emails: [ "2ls_fess_int@omega.sbrf.ru","OVShchitnikova@sberbank.ru", "SLSNTWRKDE_ess@sberbank.ru" ] }

  - "{{ logical_env_prefix }}USL_VSPC_IDL_TRIV_RESTORE":
      name: "{{ logical_env_prefix }}USL_VSPC_IDL_TRIV_RESTORE"
      category: "{{ logical_env_prefix }}USL_TRIV"
      profile: "{{ CTL_PROFILE_NAME }}"
      singleLoading: true
      type: principal
      orchestrator: oozie
      killyarnjobonerror: false
      params:
        - param:
        # Для backup это последний loading_id, а для restore  нужно задать руками
            name: backupLID
            prior_value: 0
        - param:
        # NameNode claster
            name: defaultFs
            prior_value: "{{ hadoop_default_fs_uri }}"
        - param:
        # параметр среды для логического окружения
            name: env
            prior_value: "blank"
        - param:
        #  имя утилиты
            name: jar_name
            prior_value: "{{ jar_name_triv }}"
        - param:
        # путь до утилиты
            name: jars_path
            prior_value: "{{ hdfs_path }}"
        - param:
        # Под кем авторизуемся, для Ndl  и IDL  разные
            name: keytab
            prior_value: "{{ user_name }}.keytab"
        - param:
        # Логи
            name: logs_path
            prior_value: "{{ hdfs_path }}/log"
        - param:
        # Метод запуска
            name: method
            prior_value: "restore"
        - param:
        # Путь для до workflow.xml
            name: oozie.wf.application.path
            prior_value: "{{ hdfs_path }}"
        - param:
        # авторизация в hdfs
            name: principal
            prior_value: "{{ user_name }}@{{ domain }}"
        - param:
        # Какой дата продукт backup
            name: productEntityId
            prior_value: "801{{ logical_env_ctl_entity_logenv_number }}5314"
        - param:
        # наименование продукта
            name: productName
            prior_value: "vspc_idl"
        - param:
        # Диретория в дата продукте которую backup
            name: sourceDirectory
            prior_value: "snp;stg"
        - param:
        # Очередь задания в oozie
            name: ss_queue
            prior_value: "{{ resourceGroup }}"
        - param:
        # имя пользователя под кем запускается backup
            name: user.name
            prior_value: "{{ user_name }}"
        - param:
        # путь до keytab
            name: user_keytab_path
            prior_value: "/keytab"
        - param:
        #  путь к location до hdfs
            name: sourcePath
            prior_value: "vspc_idl"
        - param:
        # период расписания  когда производится backup, задаются дни года когда производится  backup
            name: bkpPeriod
            prior_value: "m(1,7,14,21)"
        - param:
        # Количество хранимых backup
            name: bkpNumbers
            prior_value: 2
      notifications:
          - { status: "ERROR", emails: [ "2ls_fess_int@omega.sbrf.ru","OVShchitnikova@sberbank.ru", "SLSNTWRKDE_ess@sberbank.ru"  ] }
