#docs sigma https://confluence.sberbank.ru/pages/viewpage.action?pageId=5795646230
---
categories:
  - category:
      id: -1
      name: "{{ logical_env_prefix }}USL_TRIV"
      action: "USL"
      deleted: false
workflows:
  - "{{ logical_env_prefix }}USL_VSPC_IDL_TRIV_BACKUP":
      name: "{{ logical_env_prefix }}USL_VSPC_IDL_TRIV_BACKUP"
      category: "{{ logical_env_prefix }}USL_TRIV"
      profile: "{{ CTL_PROFILE_NAME }}"
      singleLoading: true
      type: principal
      orchestrator: oozie
      killyarnjobonerror: false
      schedule_params:
        eventAwaitStrategy: "and"
        cron:
          expression: "* * * * *"
          active: false
        entities:
          - entity:
              # original entity id 801005314 - vspc_idl
              id: "801{{ logical_env_ctl_entity_logenv_number }}5314"
              statisticId: 12
              profile: "{{ CTL_PROFILE_NAME }}"
              active: true
      params:
        - param:
        # Для backup это последний loading_id, а для restore  нужно задать руками
            name: backupLID
            prior_value: "blank"
        - param:
        # NameNode claster
            name: defaultFs
            prior_value: "{{ hadoop_default_fs_uri_triv }}"
        - param:
        # параметр среды для логического окружения
            name: env
            prior_value: "blank"
        - param:
        #  имя утилиты
            name: jar_name
            prior_value: "trif_ess-full-1.1.0.jar"
        - param:
        # путь до утилиты
            name: jars_path
            prior_value: "{{ hdfs_path_triv }}"
        - param:
        # Под кем авторизуемся, для Ndl  и IDL  разные
            name: keytab
            prior_value: "{{ USER_NAME }}.keytab"
        - param:
        # Логи
            name: logs_path
            prior_value: "{{ hdfs_path_triv }}/log"
        - param:
        # Метод запуска
            name: method
            prior_value: "backup"
        - param:
        # Путь для до workflow.xml
            name: oozie.wf.application.path
            prior_value: "{{ hdfs_path_triv }}"
        - param:
        # авторизация в hdfs
            name: principal
            prior_value: "{{ USER_NAME }}@{{ REALM }}"
        - param:
        # Какой дата продукт backup
            name: productEntityId
            prior_value: "801{{ logical_env_ctl_entity_logenv_number }}5314"
        - param:
        # наименование продукта
            name: productName
            prior_value: "vspc_idl"
        - param:
        # Диретория в дата продукте которую backup
            name: sourceDirectory
            prior_value: "snp;stg"
        - param:
        # Очередь задания в oozie
            name: ss_queue
            prior_value: "{{ resourceGroupTriv }}"
        - param:
        # имя пользователя под кем запускается backup
            name: user.name
            prior_value: "{{ USER_NAME }}"
        - param:
        # путь до keytab
            name: user_keytab_path
            prior_value: "/keytab"
        - param:
        #  путь к location до hdfs
            name: sourcePath
            prior_value: "vspc_idl"
        - param:
        # период расписания  когда производится backup, задаются дни года когда производится  backup
            name: bkpPeriod
            prior_value: "m(1,7,14,21)"
        - param:
        # Количество хранимых backup
            name: bkpNumbers
            prior_value: 2
        - param:
        # Профиль кластера
            name: profile_name
            prior_value: "{{ CTL_PROFILE_NAME }}"
      notifications:
          - { status: "ERROR", emails: [ "2ls_fess_int@omega.sbrf.ru","OVShchitnikova@sberbank.ru" ] }

