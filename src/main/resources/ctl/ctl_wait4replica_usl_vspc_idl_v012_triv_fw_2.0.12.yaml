        - param:
        # Очередь задания в oozie
            name: ss_queue
            prior_value: "{{ resourceGroupTriv }}"
        - param:
        # имя пользователя под кем запускается backup
            name: user.name
            prior_value: "{{ USER_NAME }}"
        - param:
        # путь до keytab
            name: user_keytab_path
            prior_value: "/keytab"
        - param:
        #  путь к location до hdfs
            name: sourcePath
            prior_value: "vspc_idl"
        - param:
        # период расписания  когда производится backup, задаются дни года когда производится  backup
            name: bkpPeriod
            prior_value: "m(1,7,14,21)"
        - param:
        # Количество хранимых backup
            name: bkpNumbers
            prior_value: 2
        - param:
        # Профиль кластера
            name: profile_name
            prior_value: "{{ CTL_PROFILE_NAME }}"
      notifications:
          - { status: "ERROR", emails: [ "2ls_fess_int@omega.sbrf.ru","OVShchitnikova@sberbank.ru","dvilapshin@sberbank.ru" ] }