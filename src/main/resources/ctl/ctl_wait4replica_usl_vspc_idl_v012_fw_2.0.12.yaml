categories:
  - category:
      id: -1
      name: "{{ logical_env_prefix }}USL_IDL"
      action: "USL"
      deleted: false
entities:
  - entity:
      # original entity id 801005314
      id: "801{{ logical_env_ctl_entity_logenv_number }}5314"
      name: "{{ logical_env_prefix }}USL_VSPC_IDL"
      path: "\\data\\usl"
      storage: "HDFS"
      parent-id: 904000000
workflows:
  - "{{ logical_env_prefix }}USL_VSPC_IDL_INIT":
      name: "{{ logical_env_prefix }}USL_VSPC_IDL_GBC_INIT"
      category: "{{ logical_env_prefix }}USL_IDL"
      profile: "{{ CTL_PROFILE_NAME }}"
      singleLoading: true
      type: principal
      orchestrator: oozie
      killyarnjobonerror: true
      schedule_params:
        eventAwaitStrategy: "and"
        cron:
          expression: "* * * * *"
          active: false
      params:
        - param:
            name: debug_distributive_path
            prior_value: /oozie-app/t/idl/vspc_idl/lib
        - param:
            name: devops_distributive_jar
            prior_value: "vspc_idl-D-01.302.011-jar-with-dependencies.jar"
        - param:
            name: data_sets
            prior_value: addr,addr_h,div_,div_h,div_type,terr_div_type
        - param:
            name: parallel_threads
            prior_value: 2
        - param:
            name: common_spark_parameters
            prior_value: "--conf spark.shuffle.service.enabled=true --conf spark.hadoop.metastore.catalog.default=spark --conf spark.sql.parquet.writeLegacyFormat=true --conf spark.executor.memory=5G --conf spark.dynamicAllocation.enabled=true --conf spark.dynamicAllocation.minExecutors=5 --conf spark.dynamicAllocation.maxExecutors=40 --conf spark.driver.memory=5G"
        - param:
            name: debug_logical_env
            prior_value: ""
        - param:
            name: oozie.wf.application.path
            prior_value: /oozie-app/t/idl/vspc_idl/init
        - param:
            name: user.name
            prior_value: "{{ USER_NAME }}"
        - param:
            name: user_keytab_path
            prior_value: "/keytab/{{ USER_NAME }}.keytab"
        - param:
            name: kerberos_realm
            prior_value: "{{ REALM }}"
        - param:
            name: yarn_queue
            prior_value: "{{ yarnQueueInit }}"
        - param:
            name: debug_sk_off
            prior_value: "Y"
        - param:
            name: hms_src_schema
            prior_value: "usl_vspc_idl_snp"
        - param:
            name: log_level
            prior_value: "ESSA"
        - param:
            name: recover_flag
            prior_value: "N"
        - param:
            name: rtfw_feature_hub_daks
            prior_value: "Y"
        - param:
            name: secman_cert_owner_email
            prior_value: "dvilapshin@sberbank.ru"
        - param:
            name: target_hdfs_namespace
            prior_value: "usl"
