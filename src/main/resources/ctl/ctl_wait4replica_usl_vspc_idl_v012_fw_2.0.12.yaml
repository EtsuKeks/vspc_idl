categories:
  - category:
      id: -1
      name: "{{ logical_env_prefix }}USL_IDL"
      action: "USL"
      deleted: false
entities:
  - entity:
      # original entity id 801005314
      id: "801{{ logical_env_ctl_entity_logenv_number }}5314"
      name: "{{ logical_env_prefix }}USL_VSPC_IDL"
      path: "\\data\\usl"
      storage: "HDFS"
      parent-id: 904000000
workflows:
  - "{{ logical_env_prefix }}USL_VSPC_IDL_INIT":
      name: "{{ logical_env_prefix }}USL_VSPC_IDL_INIT"
      category: "{{ logical_env_prefix }}USL_IDL"
      profile: "{{ CTL_PROFILE_NAME }}"
      singleLoading: true
      type: principal
      orchestrator: oozie
      killyarnjobonerror: true
      schedule_params:
        eventAwaitStrategy: "and"
        cron:
          expression: "* * * * *"
          active: false
      params:
        - param:
            name: debug_distributive_path
            prior_value: /oozie-app/bsp/VSPC/vspc_idl/lib
        - param:
            name: devops_distributive_jar
            prior_value: "vspc_idl-D-01.302.007-jar-with-dependencies.jar"
        - param:
            name: data_sets
            prior_value: addr,addrh,div,divh,divtype,terrdivtype
        - param:
            name: parallel_threads
            prior_value: 1
        - param:
            name: spark_parameters
            prior_value: "{{ sparkConf }}"
        - param:
            name: debug_logical_env
            prior_value: "{{ logical_env }}"
        - param:
            name: oozie.wf.application.path
            prior_value: /oozie-app/bsp/VSPC/vspc_idl/init
        - param:
            name: user.name
            prior_value: "{{ USER_NAME }}"
        - param:
            name: user_keytab_path
            prior_value: "/keytab/{{ USER_NAME }}.keytab"
        - param:
            name: kerberos_realm
            prior_value: "{{ REALM }}"
        - param:
            name: yarn_queue
            prior_value: "{{ yarnQueueInit }}"
        - param:
            name: debug_sk_off
            prior_value: "ON"
  - "{{ logical_env_prefix }}USL_VSPC_IDL":
      name: "{{ logical_env_prefix }}USL_VSPC_IDL"
      category: "{{ logical_env_prefix }}USL_IDL"
      profile: "{{ CTL_PROFILE_NAME }}"
      singleLoading: false
      type: principal
      orchestrator: oozie
      killyarnjobonerror: true
      schedule_params:
        eventAwaitStrategy: "and"
        cron:
          expression: "* * * * *"
          active: false
      params:
        - param:
            name: debug_distributive_path
            prior_value: /oozie-app/bsp/VSPC/vspc_idl/lib
        - param:
            name: devops_distributive_jar
            prior_value: "vspc_idl-D-01.302.007-jar-with-dependencies.jar"
        - param:
            name: data_sets
            prior_value: addr,addrh,div,divh,divtype,terrdivtype
        - param:
            name: parallel_threads
            prior_value: 1
        - param:
            name: spark_parameters
            prior_value: "{{ sparkConf }}"
        - param:
            name: debug_logical_env
            prior_value: "{{ logical_env }}"
        - param:
            name: oozie.wf.application.path
            prior_value: /oozie-app/bsp/VSPC/vspc_idl/init
        - param:
            name: user.name
            prior_value: "{{ USER_NAME }}"
        - param:
            name: user_keytab_path
            prior_value: "/keytab/{{ USER_NAME }}.keytab"
        - param:
            name: kerberos_realm
            prior_value: "{{ REALM }}"
        - param:
            name: yarn_queue
            prior_value: "{{ yarnQueue }}"
        - param:
            name: debug_sk_off
            prior_value: "ON"
            # Привязка нотификаций
      notifications:
        - { status: "ERROR", emails: [ "MDLisitsa@sberbank.ru", " alvmanuylov@sberbank.ru" ] }
        - { status: "SUCCESS", emails: [ "MDLisitsa@sberbank.ru", " alvmanuylov@sberbank.ru" ] }
