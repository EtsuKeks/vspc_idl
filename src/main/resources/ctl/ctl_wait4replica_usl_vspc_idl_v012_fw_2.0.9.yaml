            name: bkpNumbers
            prior_value: 2
      notifications:
          - { status: "ERROR", emails: [ "CAB-GD-ADDR-005888@omega.sbrf.ru" ] }

entities:
  - entity:
      # original entity id 801005314
      id: "801{{ logical_env_ctl_entity_logenv_number }}5314"
      name: "{{ logical_env_prefix }}usl_vspc_idl"
      path: "\\data\\usl"
      storage: "HDFS"
      parent-id: 904000000

