categories:
  - category:
      id: -1
      name: "{{ logical_env_prefix }}USL_IDL"
      action: "USL"
      deleted: false
workflows:
############################################################Spark CTL Yaml ############################################################
# docs sigma https://confluence.sberbank.ru/display/USL/CAP+process+flow+control+service
############################################################One Instance CTL Yaml #####################################################
  - "{{ logical_env_prefix }}USL_VSPC_IDL":
      name: "{{ logical_env_prefix }}USL_VSPC_IDL"
      category: "{{ logical_env_prefix }}USL_IDL"
      profile: "{{ CTL_PROFILE_NAME }}"
      singleLoading: true
      type: principal
      orchestrator: oozie
      killyarnjobonerror: false
      schedule_params:
        eventAwaitStrategy: "and"
        cron:
          expression: "* * * * *"
          active: false
        entities:

      params:
        - param:
            # Для backup это последний loading_id, а для restore  нужно задать руками
            name: backupLID
            prior_value: "blank"
        - param:
            # NameNode claster
            name: defaultFs
            prior_value: "{{ hadoop_default_fs_uri }}"
        - param:
            # параметр среды для логического окружения
            name: env
            prior_value: "blank"
        - param:
            #  имя утилиты
            name: jar_name
            prior_value: "trif_ess-full-1.1.0.jar"
        - param:
            # путь до утилиты
            name: jars_path
            prior_value: "/oozie-app/app/TRiV/trifrunner"
        - param:
            # Под кем авторизуемся, для Ndl  и IDL  разные
            name: keytab
            prior_value: "{{ USER_NAME }}.keytab"
        - param:
            # Логи
            name: logs_path
            prior_value: "/oozie-app/app/TRiV/trifrunne/log"
        - param:
            # Метод запуска
            name: method
            prior_value: "backup"
        - param:
            # Путь для до workflow.xml
            name: oozie.wf.application.path
            prior_value: "/oozie-app/app/TRiV/trifrunner"
        - param:
            # авторизация в hdfs
            name: principal
            prior_value: "{{ principal_alias }}"
        - param:
            # Какой дата продукт backup
            name: productEntityId
            prior_value: "801{{ logical_env_ctl_entity_logenv_number }}5314"
        - param:
            # наименование продукта
            name: productName
            prior_value: "vspc_idl"
        - param:
            # Диретория в дата продукте которую backup
            name: sourceDirectory
            prior_value: "snp;stg"
        - param:
            # Очередь задания в oozie
            name: ss_queue
            prior_value: ""
        - param:
            # имя пользователя под кем запускается backup
            name: user.name
            prior_value: "{{ USER_NAME }}"
        - param:
            # путь до keytab
            name: user_keytab_path
            prior_value: "/keytab"
        - param:
            #  путь к location до hdfs
            name: sourcePath
            prior_value: "vspc_idl"
        - param:
            # период расписания  когда производится backup, задаются дни года когда производится  backup
            name: bkpPeriod
            prior_value: "m(1,7,14,21)"
        - param:
            # Количество хранимых backup
            name: bkpNumbers
            prior_value: 2
      notifications:
          - { status: "ERROR", emails: [ "CAB-GD-ADDR-005888@omega.sbrf.ru" ] }

