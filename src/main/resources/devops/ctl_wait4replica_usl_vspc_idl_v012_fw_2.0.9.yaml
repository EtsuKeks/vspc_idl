categories:
  - category:
      id: -1
      name: "{{ logical_env_prefix }}USL_IDL"
      action: "USL"
      deleted: false
workflows:
############################################################Spark CTL Yaml ############################################################
# docs sigma https://confluence.sberbank.ru/display/USL/CAP+process+flow+control+service
############################################################One Instance CTL Yaml #####################################################
  - "{{ logical_env_prefix }}USL_VSPC_IDL":
      name: "{{ logical_env_prefix }}USL_VSPC_IDL"
      category: "{{ logical_env_prefix }}USL_IDL"
      profile: "{{ CTL_PROFILE_NAME }}"
      singleLoading: true
      type: principal
      orchestrator: oozie
      killyarnjobonerror: false
      schedule_params:
        eventAwaitStrategy: "and"
        cron:
          expression: "* * * * *"
          active: false
        entities:

      params:
        - param:
            # Пользователь под которым запускается процесс
            name: user.name
            prior_value: "{{ USER_NAME }}"
        - param:
            # Путь до приложения
            name: oozie.wf.application.path
            prior_value: "{{ file_path }}usl_vspc_idl.xml"
        - param:
            # Полный путь в HDFS к .keytab-файлу для ТУЗ data-продукта, не включающий имени самого файла и его расширения.
            name: user_keytab_path
            prior_value: "/keytab"
        - param:
            # Область (realm) Kerberos.
            name: kerberos_realm
            prior_value: "{{ kerberos_realm }}"
        - param:
            # Код очереди Yarn, в которой запускаются Spark-приложения data-продукта.
            name: yarn_queue
            prior_value: "{{ yarn_queue }}"
        - param:
            # Отладочный параметр (не может иметь непустое значение на ПРОМ-среде).
            name: debug_logical_env
            prior_value: "{{ debug_logical_env }}"
        - param:
            # Минимальная дата бизнес-истории, начиная с которой должны загружаться бизнес-историчные данные
            name: starting_business_date
            prior_value:  "{{ starting_business_date }}"
        - param:
            # Значение идентификатора загрузки, на состояние по завершению которой требуется откатить данные data-продукта после запуска загрузки данного потока
            name: rollback_loading_id
            prior_value: ""
        - param:
            # Опциональный список кодов независимых сущностей ЛМ ЕСС, для которых требуется запустить инициализацию сервиса суррогатных ключей "с нуля"
            name: resetted_entities
            prior_value: "{{ resetted_entities }}"
        - param:
            # Определяет режим работы сервиса СК при инициализирующей загрузке
            name: sk_greenfield
            prior_value: ""
        - param:
            # Список HDFS namespaces для входных data-продуктов
            name: source_hdfs_namespaces
            prior_value: "{{ source_hdfs_namespaces }}"
        - param:
            # Значение HDFS namespace для кластера HDFS, в который данный data-продукт записывает свои публикуемые данные.
            name: target_hdfs_namespace
            prior_value:  "{{ target_hdfs_namespace }}"
        - param:
            # Список мнемокодов наборов данных, которые требуется обновить data-продукту при следующем запуске
            name: data_sets
            prior_value: "{{ data_sets }}"
        - param:
            # Число одновременно запускаемых нитей исполнения в коде data-продукта
            name: parallel_threads
            prior_value: "{{ parallel_threads }}"
        - param:
            # Число дней, которые хранятся данные в таблице ctl_log
            name: calc_logs_depth_days
            prior_value: "{{ calc_logs_depth_days }}"
        - param:
            # Значения параметров Spark, которые можно передать в командную строку spark-submit.
            name: spark_parameters
            prior_value: "{{ spark_parameters }}"
        - param:
            # Содержит полный путь, от корня до имени файла  (без имен файлов) к корневому каталогу дистрибутива data-продукта
            name: debug_distributive_path
            prior_value: "{{ debug_distributive_path }}"
        - param:
            # Признак (Y/пусто=N) отключения использования сервисов СК.
            name: debug_sk_off
            prior_value: "{{ debug_sk_off }}"
        - param:
            # Имя запускаемого .jar-файла.
            name: devops_distributive_jar
            prior_value: "{{ devops_distributive_jar }}"
      notifications:
          - { status: "ERROR", emails: [ "CAB-GD-ADDR-005888@omega.sbrf.ru" ] }

