### Настройки DevSecOps ###
# Источник: https://stash.sigma.sbrf.ru/projects/OTIB/repos/devsecops_config/raw/devsecops-config.yml
# Инструкция по настройке: https://confluence.sberbank.ru/pages/viewpage.action?pageId=5033366833
### Общая информация о командах ###
team:
  - {
    # код ЕАСУП команды в справочнике SberWorks
    mus_code: "00FV0191",
    # название команды в справочнике SberWorks
    mus_name: "УСКМД. USL Runtime Framework",
    # почтовый адрес Product Owner для уведомлений с результатами сканирования. Возможно указание нескольких email через ;
    mus_po_mail: "RTFW-AutoNotifications@sberbank.ru",
  }
### Общая информация о приложении ###
app:
  # Конфигурационный элемент (КЭ) приложения / модуля ПО в Service Manager, под которым проходят релизы (не указывать КЭ ИТ-услуги).
  # !!! КЭ должен быть строкой, состоящей исключительно из цифр без лидирующих нулей !!!
  sm_id: "2304490"
  # название КЭ приложения / модуля ПО в Service Manager
  sm_name: "КАП. Интегрированные данные (Единый семантический слой)"

### Настройки SAST Checkmarx ###
sast_cx:
  # Достаточно указать один из вариантов: creds_id либо creds.secman.*
  # сredentials id в Jenkins для учетной записи Checkmarx одной команды, под которой будет проводиться сканирование
  creds_id: "CxCredRTFW"
  # проектная область в JIRA для заведения и синхронизации дефектов
  jira_area: "USL"
  # маски файлов и директорий для включения (**/*) в скан и исключения (!**/*) из скана.
  # В данном пункте требуется исключить все, что не поддерживает инструмент, либо не идет в релиз (тесты, файлы окружения и др). Актуальный список поддерживаемых языков можно найти в FAQ QG по SAST
  # Внимание! Если вы используете SQL диалект не PL/SQL (Oracle), то требуется также исключить файлы SQL
  # Пример 1: "!**/*.sql, !**/*.spec" - исключение всех файлов SQL, а также .spec
  # Пример 2: "!**/utils/**/*.xml" - исключение всех xml файлов в папке utils
  # Внимание! Есть кейсы, когда в при сборке приложения в рабочую область Jenkins помимо кода репозитория подтягиваются внешние сущности (библиотеки python, директории venv и др)
  # В таком случае нужно выполнять проверку SAST до сборки, очищать рабочую область, либо добавить сюда в маски необходимые папки, чтобы SAST не проводил их сканирование
  masks: "!build/*"
  # id профиля сканирования, по умолчанию 100012. 14 - для мобильного приложения
  # Внимание! Если вы используете мобильный пресет, то необходимо сканировать AndroidManifest.xml
  preset_id: "36"
  # макс время ожидания статуса QG в минутах
  wait_qg: "2"
  # Вывод отладочных логов плагина Checkmarx
  # Опциональный параметр. Возможные значения: true или false. По умолчанию - false
  debug: false
